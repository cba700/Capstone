<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이야기 진행하기</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-100 via-pink-50 to-blue-100 flex items-center justify-center p-4">

<div class="w-full max-w-2xl">
    <div class="text-center mb-6">
        <h1 class="text-4xl font-black text-gray-800 mb-2" th:text="${page.themeName}">테마 이름</h1>
        <p class="text-gray-600">선택에 따라 모험이 달라져요!</p>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-8">
        <!-- Narration -->
        <div class="bg-purple-50 rounded-2xl p-6 mb-6">
            <p class="text-gray-800 text-lg leading-relaxed whitespace-pre-line" th:text="${page.narration}">나레이션이 여기에 표시됩니다.</p>
        </div>

        <!-- Choices -->
        <div th:if="${page.hasChoice}" class="grid md:grid-cols-2 gap-4">
            <div th:each="choice : ${page.choices}">
                <form th:if="${#strings.isEmpty(choice.jobName)}" th:action="@{/story/{storyId}/choice(storyId=${page.storyId})}" method="post">
                    <input type="hidden" name="choiceId" th:value="${choice.choiceId}"/>
                    <button type="submit" class="w-full h-full text-left p-6 bg-white border-2 border-gray-200 rounded-2xl hover:border-purple-500 hover:bg-purple-50 transition-all duration-300 transform hover:scale-105">
                        <p class="font-semibold text-gray-800" th:text="${choice.text}">선택지 텍스트</p>
                    </button>
                </form>
                <form th:unless="${#strings.isEmpty(choice.jobName)}" th:action="@{/story/start-job}" method="post">
                    <input type="hidden" name="previousStoryId" th:value="${page.storyId}" />
                    <input type="hidden" name="jobName" th:value="${choice.jobName}" />
                    <button type="submit" class="w-full h-full text-left p-6 bg-white border-2 border-purple-300 rounded-2xl hover:border-purple-500 hover:bg-purple-50 transition-all duration-300 transform hover:scale-105">
                        <p class="font-semibold text-gray-800" th:text="${choice.text}">선택지 텍스트</p>
                    </button>
                </form>
            </div>
        </div>

        <!-- Next Button -->
        <div th:unless="${page.hasChoice}" class="text-center">
            <a th:href="@{/story/{storyId}/page/{nextStep}(storyId=${page.storyId}, nextStep=${page.step + 1})}" 
               class="inline-block px-8 py-4 bg-purple-600 text-white font-bold rounded-full hover:bg-purple-700 transition-transform transform hover:scale-105">
                다음으로 &rarr;
            </a>
        </div>
    </div>

    <div class="text-center mt-6">
        <a href="/main" class="text-sm text-gray-600 hover:text-gray-800">메인으로 돌아가기</a>
    </div>
</div>

</body>
</html>

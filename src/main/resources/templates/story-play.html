<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이야기 진행하기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            max-width: 150px;
            max-height: 150px;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-100 via-pink-50 to-blue-100 flex items-center justify-center p-4">

<!-- 로딩 오버레이 -->
<div id="loadingOverlay" class="loading-overlay">
    <div class="text-center">
        <!-- 여기에 이미지 URL을 넣으세요 -->
        <img src="/images/toki.gif" alt="로딩 중..." class="loading-spinner">
        <p class="text-white text-xl font-semibold mt-4">이야기를 불러오는 중...</p>
    </div>
</div>

<div class="w-full max-w-6xl">
    <div class="text-center mb-6">
        <h1 class="text-4xl font-black text-gray-800 mb-2" th:text="${page.themeName}">테마 이름</h1>
        <p class="text-gray-600">선택에 따라 모험이 달라져요!</p>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
        <!-- 동화책 레이아웃: 왼쪽 이미지, 오른쪽 텍스트 -->
        <div class="flex flex-col md:flex-row">

            <!-- 왼쪽: 이미지 영역 -->
            <div class="md:w-1/2 bg-gradient-to-br from-indigo-50 to-purple-50 p-8 flex items-center justify-center">
                <div th:if="${page.imageUrl != null}" class="w-full">
                    <img th:src="${page.imageUrl}"
                         alt="Story illustration"
                         class="rounded-2xl shadow-lg w-full h-auto object-cover"
                         style="max-height: 500px;" />
                </div>
                <!-- 이미지 로딩 중 또는 없을 경우 -->
                <div th:unless="${page.imageUrl != null}"
                     class="w-full h-96 bg-purple-100 rounded-2xl flex items-center justify-center">
                    <p class="text-purple-400 text-lg">🎨 이미지 생성 중...</p>
                </div>
            </div>

            <!-- 오른쪽: 텍스트 영역 -->
            <div class="md:w-1/2 p-8 flex flex-col">
                <!-- 제목 -->
                <div th:if="${page.storyTitle != null}" class="mb-6 bg-purple-50 border border-purple-200 rounded-2xl p-4">
                    <p class="text-sm uppercase text-purple-500 font-semibold">이야기 제목</p>
                    <p class="text-xl font-bold text-gray-800" th:text="${page.storyTitle}">우리의 멋진 이야기</p>
                </div>

                <!-- Narration -->
                <div class="flex-grow mb-6">
                    <p class="text-gray-800 text-lg leading-relaxed whitespace-pre-line" th:text="${page.narration}">나레이션이 여기에 표시됩니다.</p>
                </div>

                <!-- Choices -->
                <div th:if="${page.hasChoice}" class="space-y-3">
                    <div th:each="choice : ${page.choices}">
                        <form th:if="${#strings.isEmpty(choice.jobName)}"
                              th:action="@{/story/{storyId}/choice(storyId=${page.storyId})}"
                              method="post"
                              onsubmit="showLoading()">
                            <input type="hidden" name="choiceId" th:value="${choice.choiceId}"/>
                            <button type="submit" class="w-full text-left p-4 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-semibold rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg">
                                <span th:text="${choice.text}">선택지 텍스트</span>
                            </button>
                        </form>
                        <form th:unless="${#strings.isEmpty(choice.jobName)}"
                              th:action="@{/story/start-job}"
                              method="post"
                              onsubmit="showLoading()">
                            <input type="hidden" name="previousStoryId" th:value="${page.storyId}" />
                            <input type="hidden" name="jobName" th:value="${choice.jobName}" />
                            <input type="hidden" name="themeWorld" th:value="${choice.themeWorld}" />
                            <button type="submit" class="w-full text-left p-4 bg-gradient-to-r from-blue-500 to-teal-500 hover:from-blue-600 hover:to-teal-600 text-white font-semibold rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg">
                                <span th:text="${choice.text}">선택지 텍스트</span>
                                <span class="block text-sm mt-1" th:text="${'💼 ' + choice.jobName + ' 체험하기'}"></span>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Completion / Progress Buttons -->
                <div th:unless="${page.hasChoice}" class="space-y-4">
                    <div th:if="${page.completion}" class="space-y-4">
                        <div class="bg-orange-50 border border-orange-200 rounded-2xl p-6">
                            <p class="text-xl font-semibold text-orange-600">토키: 모험이 멋지게 끝났단다!</p>
                            <p class="text-gray-600 mt-2">메인 화면에서 다음 모험을 함께 골라보자!</p>
                        </div>
                        <a href="/main"
                           class="block w-full text-center px-8 py-4 bg-purple-600 text-white font-bold rounded-xl hover:bg-purple-700 transition-transform transform hover:scale-105">
                            메인으로 돌아가기
                        </a>
                    </div>
                    <div th:if="${!page.completion}">
                        <a th:href="@{/story/{storyId}/page/{nextStep}(storyId=${page.storyId}, nextStep=${page.step + 1})}"
                           class="block w-full text-center px-8 py-4 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-bold rounded-xl transition-transform transform hover:scale-105 shadow-lg">
                            다음으로 &rarr;
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-6">
        <a href="/main" class="text-sm text-gray-600 hover:text-gray-800">메인으로 돌아가기</a>
    </div>
</div>

<script>
    let isSubmitting = false;

    function showLoading() {
        // 중복 클릭 방지
        if (isSubmitting) {
            return false;
        }

        isSubmitting = true;
        document.getElementById('loadingOverlay').classList.add('active');

        // 모든 버튼 비활성화
        const buttons = document.querySelectorAll('button[type="submit"]');
        buttons.forEach(button => {
            button.disabled = true;
        });

        return true;
    }

    // 페이지 로드 시 로딩 상태 초기화
    window.addEventListener('pageshow', function(event) {
        isSubmitting = false;
        document.getElementById('loadingOverlay').classList.remove('active');

        const buttons = document.querySelectorAll('button[type="submit"]');
        buttons.forEach(button => {
            button.disabled = false;
        });
    });
</script>

</body>
</html>

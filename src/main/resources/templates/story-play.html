<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이야기 진행하기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 모바일 가로모드 강제 설정 -->
    <style>
        /* 모바일에서 가로모드 유도 */
        @media screen and (max-width: 768px) and (orientation: portrait) {
            body::before {
                content: "📱 더 나은 경험을 위해 가로모드로 회전해주세요";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.9);
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
                font-size: 18px;
                text-align: center;
                padding: 20px;
            }
            
            body > *:not(::before) {
                display: none;
            }
        }
        
        /* 모바일 가로모드에서는 동화책 레이아웃 사용 */
        @media screen and (max-width: 768px) and (orientation: landscape) {
            body {
                height: 100vh;
                overflow: hidden;
                padding: 0 !important;
            }
            
            .mobile-container {
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            
            .mobile-header {
                flex-shrink: 0;
                padding: 8px 16px;
            }
            
            .mobile-content {
                flex: 1;
                min-height: 0;
                overflow: hidden;
            }
            
            .mobile-landscape {
                display: flex !important;
                flex-direction: row !important;
                height: 100%;
            }
            
            .mobile-landscape .mobile-image {
                width: 50% !important;
                padding: 8px !important;
            }
            
            .mobile-landscape .mobile-text {
                width: 50% !important;
                padding: 8px !important;
                overflow-y: auto;
                max-height: 100%;
            }
            
            .mobile-landscape .mobile-image img {
                max-height: 100% !important;
                height: 100% !important;
                object-fit: cover;
            }
            
            /* 모바일 가로모드에서 폰트 크기 조정 */
            .mobile-text h1 {
                font-size: 1rem !important;
                margin-bottom: 4px !important;
            }
            
            .mobile-text p {
                font-size: 0.85rem !important;
                line-height: 1.3 !important;
            }
            
            .mobile-text .bg-purple-50 {
                padding: 12px !important;
                margin-bottom: 8px !important;
            }
            
            .mobile-text button {
                padding: 8px 12px !important;
                font-size: 0.8rem !important;
                margin-bottom: 4px !important;
            }
        }
    </style>
    <style>
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            max-width: 150px;
            max-height: 150px;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-100 via-pink-50 to-blue-100 p-4">

<div id="loadingOverlay" class="loading-overlay">
    <div class="bg-white/90 p-10 rounded-[3rem] shadow-2xl text-center border-4 border-purple-100">
        <div class="w-64 h-64 mx-auto mb-4 flex items-center justify-center">
            <img id="loadingImage" src="" alt="로딩중" class="max-w-full max-h-full object-contain rounded-2xl">
        </div>
        <p id="loadingImageText" class="text-2xl font-title text-purple-500 h-8 mb-2"></p>
        <h3 class="text-3xl font-title text-purple-600 mb-2 bounce-text">이야기를 만들고 있어요!</h3>
        <p class="text-gray-500 font-medium">잠시만 기다려주세요... ✨</p>
    </div>
</div>

<!-- 모바일 전용 컨테이너 -->
<div class="mobile-container">
    <!-- 제목 -->
    <div class="text-center mb-6 mobile-header">
        <h1 class="text-4xl font-black text-gray-800 mb-2" th:text="${page.themeName}">테마 이름</h1>
        <p class="text-gray-600">선택에 따라 모험이 달라져요!</p>
    </div>

    <!-- 동화책 스타일 레이아웃 -->
    <div class="max-w-7xl mx-auto mobile-content">
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden h-full">
            <div class="flex flex-col lg:flex-row mobile-landscape h-full">
            
            <!-- 왼쪽: 이미지 영역 (동화책 절반) -->
            <div class="lg:w-1/2 mobile-image bg-gradient-to-br from-purple-50 to-pink-50 flex items-center justify-center p-4 md:p-8">
                <div th:if="${page.imageUrl != null}" class="w-full h-full flex items-center justify-center">
                    <img th:src="${page.imageUrl}" alt="스토리 이미지" 
                         class="w-full h-full object-cover rounded-2xl shadow-lg min-h-60 md:min-h-80 lg:max-h-full"
                         style="max-height: 400px;">
                </div>
                <div th:unless="${page.imageUrl != null}" class="w-full h-60 md:h-96 bg-gradient-to-br from-purple-200 to-pink-200 rounded-2xl flex items-center justify-center">
                    <p class="text-purple-600 text-base md:text-lg font-semibold">이미지 로딩 중...</p>
                </div>
            </div>
            
            <!-- 오른쪽: 텍스트 영역 (동화책 절반) -->
            <div class="lg:w-1/2 mobile-text p-4 md:p-8 flex flex-col justify-between">
                
                <!-- 나레이션 -->
                <div class="flex-1 flex flex-col justify-center">
                    <div class="bg-purple-50 rounded-2xl p-6 mb-6">
                        <p class="text-gray-800 text-lg leading-relaxed whitespace-pre-line" th:text="${page.narration}">나레이션이 여기에 표시됩니다.</p>
                        <audio th:src="@{/api/tts/story/{storyId}/page/{pageNumber}(storyId=${page.storyId}, pageNumber=${page.step})}" autoplay controls class="mt-4 w-full"></audio>
                    </div>

                    <!-- 스토리 제목 -->
                    <div th:if="${page.storyTitle != null}" class="bg-white border border-purple-200 rounded-2xl p-4 mb-6">
                        <p class="text-sm uppercase text-purple-500 font-semibold">이야기 제목</p>
                        <p class="text-xl font-bold text-gray-800" th:text="${page.storyTitle}">우리의 멋진 이야기</p>
                    </div>
                </div>

                <!-- 선택지 영역 -->
                <div class="mt-auto">
                    <!-- Choices -->
                    <div th:if="${page.hasChoice}" class="grid gap-3">
                        <div th:each="choice : ${page.choices}">
                            <!-- Case 1: The story is in the 'RECOMMENDED' state, and the choice is a job. This is for starting a new job story. -->
                            <form th:if="${page.status.name() == 'RECOMMENDED' and !#strings.isEmpty(choice.jobName)}"
                                  th:action="@{/story/start-job}"
                                  method="post"
                                  onsubmit="showLoading()">
                                <input type="hidden" name="previousStoryId" th:value="${page.storyId}" />
                                <input type="hidden" name="jobName" th:value="${choice.jobName}" />
                                <input type="hidden" name="themeWorld" th:value="${choice.themeWorld}" />
                                <button type="submit" class="w-full text-left p-4 bg-white border-2 border-purple-300 rounded-xl hover:border-purple-500 hover:bg-purple-50 transition-all duration-300 transform hover:scale-105">
                                    <p class="font-semibold text-gray-800" th:text="${choice.text}">선택지 텍스트</p>
                                </button>
                            </form>

                            <!-- Case 2: All other choices (normal progression in any story). -->
                            <form th:unless="${page.status.name() == 'RECOMMENDED' and !#strings.isEmpty(choice.jobName)}"
                                  th:action="@{/story/{storyId}/choice(storyId=${page.storyId})}"
                                  method="post"
                                  onsubmit="showLoading()">
                                <input type="hidden" name="choiceId" th:value="${choice.choiceId}"/>
                                <button type="submit" class="w-full text-left p-4 bg-white border-2 border-gray-200 rounded-xl hover:border-purple-500 hover:bg-purple-50 transition-all duration-300 transform hover:scale-105">
                                    <p class="font-semibold text-gray-800" th:text="${choice.text}">선택지 텍스트</p>
                                </button>
                            </form>
                        </div>
                    </div>
                    
                    <!-- Completion / Progress Buttons -->
                    <div th:unless="${page.hasChoice}" class="text-center space-y-4">
                        <div th:if="${page.completion}" class="space-y-4">
                            <div class="bg-orange-50 border border-orange-200 rounded-2xl p-4">
                                <p class="text-lg font-semibold text-orange-600">토키: 모험이 멋지게 끝났단다!</p>
                                <p class="text-gray-600 mt-2">메인 화면에서 다음 모험을 함께 골라보자!</p>
                            </div>
                            <a href="/main"
                               class="inline-block px-6 py-3 bg-purple-600 text-white font-bold rounded-full hover:bg-purple-700 transition-transform transform hover:scale-105">
                                메인으로 돌아가기
                            </a>
                        </div>
                        <div th:if="${!page.completion}">
                            <a th:href="@{/story/{storyId}/page/{nextStep}(storyId=${page.storyId}, nextStep=${page.step + 1})}"
                               id="nextButton"
                               class="inline-block px-6 py-3 bg-purple-600 text-white font-bold rounded-full hover:bg-purple-700 transition-transform transform hover:scale-105">
                                다음으로 &rarr;
                            </a>
                        </div>
                    </div>
                </div>
                
            </div> <!-- 오른쪽 텍스트 영역 끝 -->
        </div> <!-- flex 컨테이너 끝 -->
    </div> <!-- 메인 카드 끝 -->
</div> <!-- mobile-content 끝 -->

    <!-- 하단 네비게이션 -->
    <div class="text-center mt-6">
        <a href="/main" class="text-sm text-gray-600 hover:text-gray-800">메인으로 돌아가기</a>
    </div>
</div> <!-- mobile-container 끝 -->

<script th:inline="javascript">
    /*<![CDATA[*/
    const storyId = /*[[${page.storyId}]]*/ 0;
    const currentStep = /*[[${page.step}]]*/ 0;
    const hasChoice = /*[[${page.hasChoice}]]*/ false;
    const isCompletion = /*[[${page.completion}]]*/ false;

    // 백엔드에서 주입된 직업 이미지 경로를 직접 사용
    let allLoadingImages = /*[[${jobImagePaths}]]*/ [];
    if (!allLoadingImages || allLoadingImages.length === 0) {
        allLoadingImages = ['/images/toki.gif'];
        console.log("직업 이미지를 찾을 수 없어 기본 로딩 이미지를 사용합니다.");
    }
    /*]]>*/

    let isSubmitting = false;
    let loadingIntervalId = null;

    document.addEventListener('DOMContentLoaded', function() {
        const nextButton = document.getElementById('nextButton');
        
        if (!hasChoice && !isCompletion && nextButton) {
            nextButton.classList.add('opacity-50', 'cursor-not-allowed');
            const originalHref = nextButton.href;
            nextButton.removeAttribute('href');

            const nextStep = currentStep + 1;
            const pollInterval = setInterval(() => {
                fetch(`/story/${storyId}/page/${nextStep}/status`)
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.json();
                    })
                    .then(data => {
                        if (data.ready) {
                            clearInterval(pollInterval);
                            nextButton.classList.remove('opacity-50', 'cursor-not-allowed');
                            nextButton.setAttribute('href', originalHref);
                            console.log(`페이지 ${nextStep} 준비 완료. 다음 버튼 활성화.`);
                        } else {
                            console.log(`페이지 ${nextStep} 생성 대기 중...`);
                        }
                    })
                    .catch(error => {
                        console.error('페이지 상태 확인 중 오류 발생:', error);
                        clearInterval(pollInterval);
                    });
            }, 2000);
        }
    });

    function showLoading() {
        if (isSubmitting) return false;
        isSubmitting = true;
        document.getElementById('loadingOverlay').classList.add('active');

        const loadingImageEl = document.getElementById('loadingImage');
        const loadingImageTextEl = document.getElementById('loadingImageText');

        if (loadingImageEl && allLoadingImages.length > 0) {
             const updateImage = () => {
                const newImageSrc = allLoadingImages[Math.floor(Math.random() * allLoadingImages.length)];
                loadingImageEl.src = newImageSrc;
                
                const filename = newImageSrc.split('/').pop();
                const jobName = filename.substring(0, filename.lastIndexOf('.'));
                
                if (newImageSrc !== '/images/toki.gif') {
                    loadingImageTextEl.textContent = jobName;
                } else {
                    loadingImageTextEl.textContent = '';
                }
            };
            
            updateImage();
            loadingIntervalId = setInterval(updateImage, 1000);
        }
        return true;
    }

    window.addEventListener('pageshow', function(event) {
        if (loadingIntervalId) {
            clearInterval(loadingIntervalId);
            loadingIntervalId = null;
        }
        isSubmitting = false;
        const loadingOverlay = document.getElementById('loadingOverlay');
        if (loadingOverlay) loadingOverlay.classList.remove('active');
        
        const buttons = document.querySelectorAll('button');
        buttons.forEach(button => {
            button.disabled = false;
        });
    });
</script>

</body>
</html>

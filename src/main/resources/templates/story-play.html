<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이야기 진행하기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            max-width: 150px;
            max-height: 150px;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-100 via-pink-50 to-blue-100 flex items-center justify-center p-4">

<!-- 로딩 오버레이 -->
<div id="loadingOverlay" class="loading-overlay">
    <div class="text-center">
        <!-- 여기에 이미지 URL을 넣으세요 -->
        <img src="/images/toki.gif" alt="로딩 중..." class="loading-spinner">
        <p class="text-white text-xl font-semibold mt-4">이야기를 불러오는 중...</p>
    </div>
</div>

<div class="w-full max-w-2xl">
    <div class="text-center mb-6">
        <h1 class="text-4xl font-black text-gray-800 mb-2" th:text="${page.themeName}">테마 이름</h1>
        <p class="text-gray-600">선택에 따라 모험이 달라져요!</p>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-8">
        <!-- Story Image -->
        <div th:if="${page.imageUrl != null}" class="text-center mb-6">
            <div class="bg-gradient-to-br from-purple-100 to-pink-100 rounded-2xl p-4 inline-block">
                <img th:src="${page.imageUrl}" alt="스토리 이미지" 
                     class="max-w-full h-auto rounded-xl shadow-lg max-h-80 mx-auto"
                     style="object-fit: cover;">
            </div>
        </div>

        <!-- Narration -->
        <div class="bg-purple-50 rounded-2xl p-6 mb-6">
            <p class="text-gray-800 text-lg leading-relaxed whitespace-pre-line" th:text="${page.narration}">나레이션이 여기에 표시됩니다.</p>
        </div>

        <div th:if="${page.storyTitle != null}" class="bg-white border border-purple-200 rounded-2xl p-4 mb-6">
            <p class="text-sm uppercase text-purple-500 font-semibold">이야기 제목</p>
            <p class="text-xl font-bold text-gray-800" th:text="${page.storyTitle}">우리의 멋진 이야기</p>
        </div>

        <!-- Choices -->
        <div th:if="${page.hasChoice}" class="grid md:grid-cols-2 gap-4">
            <div th:each="choice : ${page.choices}">
                <form th:if="${#strings.isEmpty(choice.jobName)}"
                      th:action="@{/story/{storyId}/choice(storyId=${page.storyId})}"
                      method="post"
                      onsubmit="showLoading()">
                    <input type="hidden" name="choiceId" th:value="${choice.choiceId}"/>
                    <button type="submit" class="w-full h-full text-left p-6 bg-white border-2 border-gray-200 rounded-2xl hover:border-purple-500 hover:bg-purple-50 transition-all duration-300 transform hover:scale-105">
                        <p class="font-semibold text-gray-800" th:text="${choice.text}">선택지 텍스트</p>
                    </button>
                </form>
                <form th:unless="${#strings.isEmpty(choice.jobName)}"
                      th:action="@{/story/start-job}"
                      method="post"
                      onsubmit="showLoading()">
                    <input type="hidden" name="previousStoryId" th:value="${page.storyId}" />
                    <input type="hidden" name="jobName" th:value="${choice.jobName}" />
                    <input type="hidden" name="themeWorld" th:value="${choice.themeWorld}" />
                    <button type="submit" class="w-full h-full text-left p-6 bg-white border-2 border-purple-300 rounded-2xl hover:border-purple-500 hover:bg-purple-50 transition-all duration-300 transform hover:scale-105">
                        <p class="font-semibold text-gray-800" th:text="${choice.text}">선택지 텍스트</p>
                    </button>
                </form>
            </div>
        </div>
        <!-- Completion / Progress Buttons -->
        <div th:unless="${page.hasChoice}" class="text-center space-y-6">
            <div th:if="${page.completion}" class="space-y-4">
                <div class="bg-orange-50 border border-orange-200 rounded-2xl p-6">
                    <p class="text-xl font-semibold text-orange-600">토키: 모험이 멋지게 끝났단다!</p>
                    <p class="text-gray-600 mt-2">메인 화면에서 다음 모험을 함께 골라보자!</p>
                </div>
                <a href="/main"
                   class="inline-block px-8 py-4 bg-purple-600 text-white font-bold rounded-full hover:bg-purple-700 transition-transform transform hover:scale-105">
                    메인으로 돌아가기
                </a>
            </div>
            <div th:if="${!page.completion}">
                <a th:href="@{/story/{storyId}/page/{nextStep}(storyId=${page.storyId}, nextStep=${page.step + 1})}"
                   class="inline-block px-8 py-4 bg-purple-600 text-white font-bold rounded-full hover:bg-purple-700 transition-transform transform hover:scale-105">
                    다음으로 &rarr;
                </a>
            </div>
        </div>
    </div>

    <div class="text-center mt-6">
        <a href="/main" class="text-sm text-gray-600 hover:text-gray-800">메인으로 돌아가기</a>
    </div>
</div>

<script>
    let isSubmitting = false;

    function showLoading() {
        // 중복 클릭 방지
        if (isSubmitting) {
            return false;
        }

        isSubmitting = true;
        document.getElementById('loadingOverlay').classList.add('active');

        // 모든 버튼 비활성화
        const buttons = document.querySelectorAll('button[type="submit"]');
        buttons.forEach(button => {
            button.disabled = true;
        });

        return true;
    }

    // 페이지 로드 시 로딩 상태 초기화
    window.addEventListener('pageshow', function(event) {
        isSubmitting = false;
        document.getElementById('loadingOverlay').classList.remove('active');

        const buttons = document.querySelectorAll('button[type="submit"]');
        buttons.forEach(button => {
            button.disabled = false;
        });
    });
</script>

</body>
</html>

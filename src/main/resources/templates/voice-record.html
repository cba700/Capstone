<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 목소리 녹음하기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Poor+Story&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poor Story', cursive;
            background: linear-gradient(135deg, #8EC5FC 0%, #E0C3FC 50%, #fbc2eb 100%);
        }
        h1, h2, h3, .font-title {
            font-family: 'Jua', sans-serif;
        }
        .recording-pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="bg-white rounded-3xl p-8 sm:p-10 max-w-2xl w-full relative shadow-2xl">
    <a href="/main" class="absolute top-4 left-4 p-2 text-gray-400 hover:text-gray-600 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span class="sr-only">메인으로 돌아가기</span>
    </a>

    <div id="initial-view">
        <h2 class="text-3xl font-title text-gray-800 mb-4 text-center">나만의 목소리 만들기</h2>
        <p class="text-center text-gray-600 mb-8">안내에 따라 4개의 문장을 녹음하면, <br/>세상에 하나뿐인 목소리로 동화를 만들 수 있어요.</p>
        <div class="text-center">
            <button id="start-process-btn" class="px-8 py-4 bg-purple-600 text-white font-bold text-xl rounded-full hover:bg-purple-700 transition-transform transform hover:scale-105">
                시작하기
            </button>
        </div>
    </div>

    <div id="recording-view" class="hidden">
        <h2 class="text-3xl font-title text-gray-800 mb-2 text-center">목소리 녹음하기</h2>
        <p id="progress-text" class="text-center text-gray-500 mb-6 font-bold">문장 (1 / 4)</p>
        
        <div class="text-center mb-8">
            <p class="text-gray-600 text-lg leading-relaxed mb-4">아래 문장을 또박또박 읽어주세요.</p>
            <p id="sample-sentence" class="text-gray-800 text-xl font-bold bg-purple-50 p-4 rounded-xl inline-block shadow-sm min-h-[6rem]">
                <!-- Sentence will be loaded here -->
            </p>
        </div>

        <div class="flex flex-col items-center gap-4">
            <div id="recording-status" class="flex items-center gap-2 text-red-500 font-bold hidden">
                <span class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></span>
                <span>녹음 중...</span>
            </div>
            
            <div id="controls-container" class="flex gap-4 items-center">
                <button id="record-btn" class="px-6 py-3 bg-blue-500 text-white font-bold rounded-full hover:bg-blue-600 transition-colors flex items-center gap-2">
                    <i class="fas fa-microphone"></i><span>녹음 시작</span>
                </button>
                <button id="stop-btn" class="px-6 py-3 bg-red-500 text-white font-bold rounded-full hover:bg-red-600 transition-colors hidden">
                    녹음 중지
                </button>
                <button id="next-btn" class="px-6 py-3 bg-green-500 text-white font-bold rounded-full hover:bg-green-600 transition-colors hidden">
                    다음 문장으로
                </button>
            </div>

            <audio id="preview-audio" controls class="w-full max-w-sm mt-4 hidden"></audio>
        </div>
    </div>

    <div id="final-view" class="hidden">
        <h2 class="text-3xl font-title text-gray-800 mb-4 text-center">녹음 완료!</h2>
        <p class="text-center text-gray-600 mb-8">마지막 단계예요. 목소리의 이름을 정하고 '생성하기' 버튼을 눌러주세요.</p>

        <div class="max-w-sm mx-auto">
            <input type="text" id="voiceName" placeholder="목소리 이름 (예: 엄마 목소리)" class="w-full p-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-purple-500 transition mb-4">
            <button id="submit-all" class="w-full px-8 py-4 bg-purple-600 text-white font-bold text-xl rounded-lg hover:bg-purple-700 transition-all duration-300 transform hover:scale-105 disabled:bg-gray-400 disabled:cursor-not-allowed">
                내 목소리 생성하기
            </button>
        </div>
    </div>
    
    <div id="alert-container" class="mt-6"></div>

</div>

<script th:inline="javascript">
    const sentences = /*[[${sentences}]]*/ [];
    let currentSentenceIndex = 0;
    const recordedBlobs = new Array(sentences.length).fill(null);
    let mediaRecorder;
    let audioChunks = [];
    let stream;

    // Views
    const initialView = document.getElementById('initial-view');
    const recordingView = document.getElementById('recording-view');
    const finalView = document.getElementById('final-view');
    
    // Buttons
    const startProcessBtn = document.getElementById('start-process-btn');
    const recordBtn = document.getElementById('record-btn');
    const stopBtn = document.getElementById('stop-btn');
    const nextBtn = document.getElementById('next-btn');
    const submitBtn = document.getElementById('submit-all');

    // UI Elements
    const progressText = document.getElementById('progress-text');
    const sampleSentence = document.getElementById('sample-sentence');
    const recordingStatus = document.getElementById('recording-status');
    const previewAudio = document.getElementById('preview-audio');
    const voiceNameInput = document.getElementById('voiceName');

    function updateSentence() {
        sampleSentence.textContent = sentences[currentSentenceIndex];
        progressText.textContent = `문장 (${currentSentenceIndex + 1} / ${sentences.length})`;
        
        recordBtn.disabled = false;
        recordBtn.classList.remove('hidden');
        recordBtn.querySelector('span').textContent = '녹음 시작';
        stopBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        previewAudio.classList.add('hidden');
        if (previewAudio.src) {
            URL.revokeObjectURL(previewAudio.src);
            previewAudio.src = '';
        }
    }
    
    startProcessBtn.addEventListener('click', () => {
        initialView.classList.add('hidden');
        recordingView.classList.remove('hidden');
        updateSentence();
    });

    recordBtn.addEventListener('click', async () => {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                recordedBlobs[currentSentenceIndex] = audioBlob;
                const audioUrl = URL.createObjectURL(audioBlob);
                previewAudio.src = audioUrl;

                recordBtn.classList.remove('hidden');
                recordBtn.querySelector('span').textContent = '다시 녹음';
                stopBtn.classList.add('hidden');
                nextBtn.classList.remove('hidden');
                previewAudio.classList.remove('hidden');
                recordingStatus.classList.add('hidden');
                
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
            };

            mediaRecorder.start();
            recordingStatus.classList.remove('hidden');
            recordBtn.disabled = true;
            stopBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            previewAudio.classList.add('hidden');

        } catch (err) {
            showAlert('음성 녹음을 사용하려면 마이크 권한이 필요합니다.', 'error');
        }
    });

    stopBtn.addEventListener('click', () => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
    });

    nextBtn.addEventListener('click', () => {
        currentSentenceIndex++;
        if (currentSentenceIndex < sentences.length) {
            updateSentence();
        } else {
            recordingView.classList.add('hidden');
            finalView.classList.remove('hidden');
        }
    });
    
    submitBtn.addEventListener('click', async () => {
        const voiceName = voiceNameInput.value.trim();
        if (!voiceName) {
            showAlert('목소리 이름을 입력해주세요.', 'warning');
            voiceNameInput.focus();
            return;
        }

        const allRecorded = recordedBlobs.every(blob => blob !== null);
        if (!allRecorded) {
            showAlert('모든 문장을 녹음해야 합니다.', 'error');
            return;
        }

        const formData = new FormData();
        formData.append('name', voiceName);
        recordedBlobs.forEach((blob, index) => {
            formData.append('files', blob, `recording_${index + 1}.webm`);
        });
        
        showAlert('목소리 생성을 시작합니다. 몇 분 정도 소요될 수 있습니다...', 'info', false);
        submitBtn.disabled = true;
        submitBtn.textContent = '생성 중...';

        try {
            const response = await fetch('/api/voices/clone', {
                method: 'POST',
                body: formData,
            });

            if (response.ok) {
                const result = await response.json();
                showAlert(`목소리 생성에 성공했습니다! 이제부터 내 목소리로 동화를 읽을 수 있어요.`, 'success');
                 setTimeout(() => window.location.href = '/main', 2000);
            } else {
                const errorText = await response.text();
                throw new Error(errorText || '알 수 없는 오류가 발생했습니다.');
            }

        } catch (error) {
            showAlert(`목소리 생성 중 오류가 발생했습니다: ${error.message}`, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '내 목소리 생성하기';
        }
    });
    
    function showAlert(message, type = 'info', autoDismiss = true) {
        const container = document.getElementById('alert-container');
        let bgColor, textColor, icon;

        switch (type) {
            case 'success': bgColor = 'bg-green-100'; textColor = 'text-green-700'; icon = 'fa-check-circle'; break;
            case 'error': bgColor = 'bg-red-100'; textColor = 'text-red-700'; icon = 'fa-exclamation-triangle'; break;
            case 'warning': bgColor = 'bg-yellow-100'; textColor = 'text-yellow-700'; icon = 'fa-exclamation-circle'; break;
            default: bgColor = 'bg-blue-100'; textColor = 'text-blue-700'; icon = 'fa-info-circle'; break;
        }

        const alert = document.createElement('div');
        alert.className = `p-4 mb-4 text-sm ${textColor} ${bgColor} rounded-lg flex items-center transition-opacity duration-300`;
        alert.innerHTML = `<i class="fas ${icon} mr-3"></i><span class="font-medium">${message}</span>`;
        
        container.innerHTML = '';
        container.appendChild(alert);

        if (autoDismiss) {
            setTimeout(() => {
                alert.classList.add('opacity-0');
                setTimeout(() => alert.remove(), 300);
            }, 5000);
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테마 선택 - 꿈꾸는 직업 이야기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Poor+Story&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poor Story', cursive; }
        h1, h2, h3, button, .font-title { font-family: 'Jua', sans-serif; }

        /* 배경 애니메이션 */
        .gradient-bg {
            background: linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 100%);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 구름 카드 스타일 */
        .cloud-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 4px solid #fff;
            border-radius: 2.5rem;
            box-shadow: 0 10px 30px rgba(167, 139, 250, 0.15);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            position: relative;
        }

        .cloud-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 20px 40px rgba(167, 139, 250, 0.25);
            border-color: #F3E8FF;
        }

        /* 이미지 컨테이너 */
        .theme-image-container {
            overflow: hidden;
            border-radius: 2rem;
            position: relative;
        }

        .theme-image {
            transition: transform 0.7s ease;
        }

        .cloud-card:hover .theme-image {
            transform: scale(1.1);
        }

        /* 로딩 오버레이 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-overlay.active {
            display: flex;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 로딩 텍스트 애니메이션 */
        .bounce-text { animation: bounce 1s infinite; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen overflow-x-hidden text-gray-700">

<div class="fixed inset-0 pointer-events-none">
    <div class="absolute top-10 left-10 w-64 h-64 bg-white/20 rounded-full blur-3xl mix-blend-overlay animate-pulse"></div>
    <div class="absolute bottom-20 right-20 w-80 h-80 bg-purple-300/20 rounded-full blur-3xl mix-blend-overlay animate-pulse" style="animation-delay: 2s;"></div>
</div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="bg-white/90 p-10 rounded-[3rem] shadow-2xl text-center border-4 border-purple-100">
        <div class="w-64 h-64 mx-auto mb-4 flex items-center justify-center">
            <img id="loadingImage" src="" alt="로딩중" class="max-w-full max-h-full object-contain rounded-2xl">
        </div>
        <p id="loadingImageText" class="text-2xl font-title text-purple-500 h-8 mb-2"></p>
        <h3 class="text-3xl font-title text-purple-600 mb-2 bounce-text">이야기를 만들고 있어요!</h3>
        <p class="text-gray-500 font-medium">잠시만 기다려주세요... ✨</p>
    </div>
</div>

<div class="relative z-10 max-w-7xl mx-auto px-4 py-8 flex flex-col min-h-screen">

    <div class="flex items-center justify-between mb-12">
        <a href="/main" class="group flex items-center gap-2 px-5 py-2.5 bg-white/60 rounded-full hover:bg-white transition-all shadow-sm backdrop-blur-sm">
            <svg class="text-gray-500 group-hover:text-purple-500 transition-colors" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span class="font-title text-gray-600 group-hover:text-purple-500 text-lg">뒤로가기</span>
        </a>

        <div class="hidden sm:block px-6 py-2 bg-white/40 rounded-full text-white font-title text-lg shadow-sm">
            🎨 아이가 좋아할 테마를 골라주세요
        </div>
    </div>

    <div class="text-center mb-16">
        <div class="inline-flex justify-center items-center w-20 h-20 bg-white rounded-[2rem] shadow-lg mb-6 transform rotate-3">
            <svg class="text-yellow-400" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
        </div>
        <h1 class="text-5xl sm:text-6xl font-title text-white mb-4 drop-shadow-md tracking-wide">
            어떤 세상으로 떠날까요?
        </h1>
        <p class="text-white/90 text-xl font-medium">
            마음에 드는 그림을 선택하면 이야기가 시작돼요
        </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-12">

        <div th:each="theme : ${themes}" class="h-full">
            <form th:action="@{/story/create}" method="post" onsubmit="showLoading()" class="h-full">
                <input type="hidden" name="childId" th:value="${childId}" />
                <input type="hidden" name="themeId" th:value="${theme.id}" />

                <button type="submit" class="cloud-card w-full h-full text-left group p-3">
                    <div class="theme-image-container aspect-[4/3] mb-5 relative">
                        <div class="absolute top-4 left-4 z-10 bg-white/90 backdrop-blur px-4 py-1.5 rounded-full shadow-md border border-white">
                            <span class="font-title text-purple-600" th:text="${theme.name}">테마명</span>
                        </div>

                        <img th:src="@{'/images/themes/' + ${theme.id} + '.jpg'}"
                             th:alt="${theme.name}"
                             class="theme-image w-full h-full object-cover"
                             onerror="this.src='https://via.placeholder.com/400x300/e9d5ff/8b5cf6?text=Theme'">

                        <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                            <div class="bg-white/90 backdrop-blur text-purple-600 px-6 py-3 rounded-full font-title text-lg shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300">
                                이 테마 선택하기 ✨
                            </div>
                        </div>
                    </div>

                    <div class="px-4 pb-4">
                        <h3 class="text-2xl font-title text-gray-800 mb-2 group-hover:text-purple-600 transition-colors" th:text="${theme.name}">테마 이름</h3>
                        <p class="text-gray-500 text-lg leading-relaxed line-clamp-2" th:text="${theme.description}">
                            테마에 대한 설명이 들어가는 곳입니다. 몽글몽글한 구름 위를 걷는 듯한 기분을 느껴보세요.
                        </p>
                    </div>
                </button>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(themes)}" class="col-span-full text-center py-20">
            <div class="cloud-card inline-block p-12">
                <svg class="mx-auto text-gray-300 mb-4" xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                <h3 class="text-2xl font-title text-gray-600">준비된 테마가 없어요</h3>
                <p class="text-gray-400 mt-2">관리자에게 문의해주세요.</p>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    let isSubmitting = false;
    let loadingIntervalId = null;
    
    // 백엔드에서 주입된 직업 이미지 경로를 직접 사용
    let allLoadingImages = /*[[${jobImagePaths}]]*/ [];
    if (!allLoadingImages || allLoadingImages.length === 0) {
        // 이미지가 없을 경우, 기본 토키 이미지로 대체
        allLoadingImages = ['/images/toki.gif'];
        console.log("직업 이미지를 찾을 수 없어 기본 로딩 이미지를 사용합니다.");
    }

    function showLoading() {
        if (isSubmitting) {
            return false;
        }
        isSubmitting = true;
        document.getElementById('loadingOverlay').classList.add('active');

        const loadingImageEl = document.getElementById('loadingImage');
        const loadingImageTextEl = document.getElementById('loadingImageText');

        if (loadingImageEl && allLoadingImages.length > 0) {
            const updateImage = () => {
                const newImageSrc = allLoadingImages[Math.floor(Math.random() * allLoadingImages.length)];
                loadingImageEl.src = newImageSrc;
                
                const filename = newImageSrc.split('/').pop();
                const jobName = filename.substring(0, filename.lastIndexOf('.'));
                
                if (newImageSrc !== '/images/toki.gif') {
                    loadingImageTextEl.textContent = jobName;
                } else {
                    loadingImageTextEl.textContent = '';
                }
            };
            
            updateImage();
            loadingIntervalId = setInterval(updateImage, 1000);
        }
        return true;
    }

    // 페이지 복원 시 (뒤로가기 등) 로딩 화면 해제
    window.addEventListener('pageshow', function(event) {
        if (loadingIntervalId) {
            clearInterval(loadingIntervalId);
            loadingIntervalId = null;
        }
        if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
             isSubmitting = false;
             document.getElementById('loadingOverlay').classList.remove('active');
        }
    });
</script>

</body>
</html>

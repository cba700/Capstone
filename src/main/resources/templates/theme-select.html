<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>테마 선택 - 꿈꾸는 직업 이야기</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-100 via-pink-50 to-blue-100 py-8">
<div class="max-w-6xl mx-auto px-4">
    <div class="flex flex-col gap-4 mb-8">
        <a href="/main" class="inline-flex items-center gap-2 text-purple-600 hover:text-purple-800 font-semibold">
            <span class="text-lg">←</span>
            <span>메인으로 돌아가기</span>
        </a>
        <div>
            <h1 class="text-3xl font-bold text-gray-800">새로운 이야기 준비하기</h1>
            <p class="text-gray-600">계정에 등록된 아이가 바로 모험을 떠나요. 테마만 골라주세요!</p>
        </div>
    </div>

    <div>
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-2xl font-bold text-gray-800">테마 고르기</h2>
            <button id="refreshThemes" class="text-sm font-semibold text-purple-600 hover:text-purple-800">새로고침</button>
        </div>
        <div id="themeGrid" class="grid gap-6 md:grid-cols-3">
            <div th:each="theme : ${themes}" class="bg-white rounded-3xl shadow-xl p-6 flex flex-col gap-3">
                <div class="text-sm font-semibold text-purple-500 uppercase tracking-wide" th:text="${theme.code}">CODE</div>
                <div class="text-xl font-bold text-gray-800" th:text="${theme.title}">테마 제목</div>
                <p class="text-sm text-gray-600 h-20 overflow-hidden" th:text="${theme.description}">테마 설명</p>
                <button class="mt-auto bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-xl px-4 py-2 font-semibold start-theme"
                        th:attr="data-theme-id=${theme.id}">이야기 시작</button>
            </div>
            <p th:if="${#lists.isEmpty(themes)}" class="text-gray-500">등록된 테마가 없습니다.</p>
        </div>
    </div>
</div>

<script>
const themeGrid = document.getElementById('themeGrid');
const refreshButton = document.getElementById('refreshThemes');

async function fetchJson(url, options) {
    const res = await fetch(url, options);
    if (!res.ok) {
        throw new Error('요청이 실패했어요.');
    }
    return res.json();
}

function renderThemes(themes) {
    if (!themes.length) {
        themeGrid.innerHTML = '<p class="text-gray-500">등록된 테마가 없습니다.</p>';
        return;
    }
    themeGrid.innerHTML = '';
    themes.forEach(theme => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-3xl shadow-xl p-6 flex flex-col gap-3 hover:-translate-y-1 transition-transform cursor-pointer';
        card.innerHTML = `
            <div class="text-sm font-semibold text-purple-500 uppercase tracking-wide">${theme.code}</div>
            <div class="text-xl font-bold text-gray-800">${theme.title}</div>
            <p class="text-sm text-gray-600 h-20 overflow-hidden">${theme.description ?? ''}</p>
            <button class="mt-auto bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-xl px-4 py-2 font-semibold">이야기 시작</button>
        `;
        card.querySelector('button').addEventListener('click', () => startSession(theme.id));
        themeGrid.appendChild(card);
    });
}

async function loadThemes() {
    const themes = await fetchJson('/api/themes');
    renderThemes(themes);
}

async function startSession(themeId) {
    try {
        const response = await fetchJson('/api/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ themeId })
        });
        window.location.href = `/story/play?sessionId=${response.session.sessionId}`;
    } catch (e) {
        alert('세션을 시작할 수 없어요. 잠시 뒤 다시 시도해주세요.');
    }
}

refreshButton.addEventListener('click', loadThemes);

document.querySelectorAll('.start-theme').forEach(btn => {
    btn.addEventListener('click', () => startSession(Number(btn.dataset.themeId)));
});

if (!document.querySelector('.start-theme')) {
    loadThemes();
}
</script>
</body>
</html>

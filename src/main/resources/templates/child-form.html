<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 아이 추가 - 꿈꾸는 직업 이야기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        * { font-family: 'Noto Sans KR', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

<div class="max-w-md w-full">
    <div class="glass rounded-[3rem] shadow-2xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black text-gray-800">새 아이 추가 ✨</h1>
            <p class="text-gray-600 mt-2">새로운 아이의 정보를 입력해주세요.</p>
        </div>

        <form th:action="@{/children/create}" th:object="${childCreateRequestDto}" method="post" class="space-y-5">
            <div>
                <label for="childName" class="block text-sm font-bold text-gray-700 mb-2">이름</label>
                <input type="text" id="childName" th:field="*{name}" required class="w-full px-5 py-3 rounded-2xl border-2 border-gray-200 focus:border-purple-500 focus:outline-none font-medium transition-all" placeholder="아이의 이름을 입력하세요">
            </div>

            <div>
                <label for="childAge" class="block text-sm font-bold text-gray-700 mb-2">나이</label>
                <input type="number" id="childAge" th:field="*{age}" required min="1" max="18" class="w-full px-5 py-3 rounded-2xl border-2 border-gray-200 focus:border-purple-500 focus:outline-none font-medium transition-all" placeholder="나이를 입력하세요">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-3">성별</label>
                <div class="flex gap-3">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" th:field="*{gender}" value="BOY" required class="hidden peer">
                        <div class="px-6 py-4 rounded-2xl border-2 border-gray-200 peer-checked:border-blue-500 peer-checked:bg-blue-50 text-center font-bold text-gray-600 peer-checked:text-blue-600 transition-all hover:border-blue-300">
                            👦 남자
                        </div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" th:field="*{gender}" value="GIRL" required class="hidden peer">
                        <div class="px-6 py-4 rounded-2xl border-2 border-gray-200 peer-checked:border-pink-500 peer-checked:bg-pink-50 text-center font-bold text-gray-600 peer-checked:text-pink-600 transition-all hover:border-pink-300">
                            👧 여자
                        </div>
                    </label>
                </div>
            </div>

            <div class="pt-4 space-y-3">
                 <button type="submit" class="w-full py-4 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-black text-lg rounded-2xl shadow-lg hover:shadow-xl transform hover:scale-105 transition-all">
                    추가하기
                </button>
                <a href="/children" class="block w-full text-center py-3 bg-gray-200 text-gray-700 font-bold rounded-2xl hover:bg-gray-300 transition-all">
                    취소
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>

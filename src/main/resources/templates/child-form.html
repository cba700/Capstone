<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 아이 추가</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Poor+Story&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poor Story', cursive; }
        h1, h2, label, button, .font-title { font-family: 'Jua', sans-serif; }

        /* 파스텔톤 그라데이션 */
        .gradient-bg {
            background: linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 100%);
            background-size: 200% 200%;
            animation: gradient 10s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .cloud-card {
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #fff;
            border-radius: 2rem;
            box-shadow: 0 10px 25px rgba(142, 197, 252, 0.2);
        }

        .input-cloud:focus {
            border-color: #c084fc;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(192, 132, 252, 0.1);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

<div class="max-w-md w-full">
    <div class="cloud-card p-8 sm:p-10">
        <div class="text-center mb-8">
            <div class="inline-flex justify-center items-center w-16 h-16 bg-purple-50 text-purple-400 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-700 mb-2">새로운 친구 등록</h1>
            <p class="text-gray-500 text-lg">아이의 정보를 입력해 주세요</p>
        </div>

        <form th:action="@{/children/create}" th:object="${childCreateRequestDto}" method="post" class="space-y-6">

            <div>
                <label for="childName" class="block text-lg text-gray-600 mb-2 pl-2">이름</label>
                <input type="text" id="childName" th:field="*{name}" required
                       class="input-cloud w-full px-6 py-3.5 rounded-2xl border-2 border-purple-100 bg-purple-50/30 text-gray-700 font-bold text-lg outline-none transition-all placeholder-gray-300"
                       placeholder="예) 김구름">
            </div>

            <div>
                <label for="childAge" class="block text-lg text-gray-600 mb-2 pl-2">나이</label>
                <input type="number" id="childAge" th:field="*{age}" required min="1" max="18"
                       class="input-cloud w-full px-6 py-3.5 rounded-2xl border-2 border-purple-100 bg-purple-50/30 text-gray-700 font-bold text-lg outline-none transition-all placeholder-gray-300"
                       placeholder="숫자만 입력">
            </div>

            <div>
                <label class="block text-lg text-gray-600 mb-3 pl-2">성별</label>
                <div class="flex gap-4">
                    <label class="flex-1 cursor-pointer group">
                        <input type="radio" th:field="*{gender}" value="BOY" required class="hidden peer">
                        <div class="px-4 py-4 rounded-2xl border-2 border-blue-100 bg-blue-50/30 peer-checked:border-blue-400 peer-checked:bg-blue-50 text-center transition-all group-hover:bg-blue-50">
                            <div class="flex justify-center mb-1 text-blue-400 peer-checked:text-blue-600">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                            </div>
                            <span class="block font-bold text-blue-400 peer-checked:text-blue-600">남자아이</span>
                        </div>
                    </label>
                    <label class="flex-1 cursor-pointer group">
                        <input type="radio" th:field="*{gender}" value="GIRL" required class="hidden peer">
                        <div class="px-4 py-4 rounded-2xl border-2 border-pink-100 bg-pink-50/30 peer-checked:border-pink-400 peer-checked:bg-pink-50 text-center transition-all group-hover:bg-pink-50">
                            <div class="flex justify-center mb-1 text-pink-400 peer-checked:text-pink-600">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a7 7 0 0 1 7 7c0 2.5-2 4-3.5 5"/><path d="M8.5 14C7 13 5 11.5 5 9a7 7 0 0 1 7-7"/><path d="M9 9h.01"/><path d="M15 9h.01"/><path d="M8 15a4 4 0 0 0 8 0"/></svg>
                            </div>
                            <span class="block font-bold text-pink-400 peer-checked:text-pink-600">여자아이</span>
                        </div>
                    </label>
                </div>
            </div>

            <div class="pt-6 space-y-3">
                <button type="submit" class="w-full py-4 bg-purple-400 hover:bg-purple-500 text-white font-bold text-xl rounded-2xl shadow-lg hover:shadow-xl transition-all transform active:scale-95">
                    등록 완료
                </button>
                <a href="/children" class="block w-full text-center py-3.5 text-gray-500 font-bold hover:text-gray-700 transition-all">
                    취소하기
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>

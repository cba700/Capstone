<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>부모 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-100 via-pink-50 to-blue-100 py-10">
<div class="max-w-6xl mx-auto px-4">
    <div class="flex items-center justify-between mb-6">
        <div>
            <p class="text-sm text-gray-600">환영합니다</p>
            <h1 class="text-3xl font-bold text-gray-800" th:text="${parentName}">부모님</h1>
        </div>
        <a href="/main" class="text-purple-600 font-semibold hover:text-purple-800">메인으로</a>
    </div>

    <div class="grid md:grid-cols-2 gap-6 mb-10">
        <div class="bg-white rounded-3xl shadow-xl p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-3">최근 스토리북</h2>
            <div class="flex flex-col gap-4">
                <div th:each="book : ${books}" class="border border-purple-100 rounded-2xl p-4">
                    <div class="text-sm font-semibold text-purple-500" th:text="${'세션 #' + book.session.id}">세션</div>
                    <div class="text-lg font-bold text-gray-800" th:text="${book.title}">제목</div>
                    <p class="text-sm text-gray-600 mb-3" th:text="${book.summary}">요약</p>
                    <a th:href="@{'/story/view'(bookId=${book.id})}" class="text-sm font-semibold text-purple-600">스토리 보기</a>
                </div>
                <p th:if="${#lists.isEmpty(books)}" class="text-gray-500">아직 저장된 스토리북이 없어요.</p>
            </div>
        </div>
        <div class="bg-white rounded-3xl shadow-xl p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">AI 성향 분석</h2>
            <p class="text-gray-600 mb-4">완료된 세션에서 누적된 태그 요약입니다.</p>
            <div class="flex flex-wrap gap-3">
                <span th:each="entry : ${traitSummary.entrySet()}"
                      th:text="${entry.key + ' ' + entry.value}"
                      class="px-3 py-1 text-sm font-semibold bg-purple-50 text-purple-600 rounded-full">태그</span>
                <span th:if="${traitSummary.isEmpty()}" class="text-gray-500 text-sm">세션이 완료되면 태그가 표시됩니다.</span>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-3xl shadow-xl p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">최근 세션</h2>
        <div class="space-y-4">
            <div th:each="session : ${sessions}" class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 border border-purple-100 rounded-2xl p-4">
                <div>
                    <div class="font-semibold text-gray-800" th:text="${session.theme.title}">테마</div>
                    <div class="text-sm text-gray-500" th:text="${session.child.childName}">아이 이름</div>
                </div>
                <div class="text-sm text-purple-600 font-semibold" th:text="${session.status}">상태</div>
                <a th:href="@{'/story/play'(sessionId=${session.id})}" class="text-sm text-purple-600 font-semibold">세션 보기</a>
            </div>
            <p th:if="${#lists.isEmpty(sessions)}" class="text-gray-500">진행 중인 세션이 없습니다.</p>
        </div>
    </div>
</div>
</body>
</html>

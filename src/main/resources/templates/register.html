<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 꿈꾸는 직업 이야기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 간단한 펄스 애니메이션을 위한 커스텀 CSS (Tailwind의 animate-pulse와 유사) */
        @keyframes pulse {
            50% {
                opacity: .5;
            }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-100 via-pink-50 to-blue-100 flex items-center justify-center p-4 font-sans">

<!-- Background decorative elements -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-10 w-20 h-20 bg-yellow-300 rounded-full opacity-20 animate-pulse"></div>
    <div class="absolute bottom-32 right-20 w-32 h-32 bg-purple-300 rounded-full opacity-20 animate-pulse" style="animation-delay: 1s;"></div>
    <div class="absolute top-1/3 right-1/4 w-16 h-16 bg-pink-300 rounded-full opacity-20 animate-pulse" style="animation-delay: 2s;"></div>
</div>

<div class="w-full max-w-md relative">
    <!-- Header Section -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-purple-500 to-pink-500 rounded-3xl mb-4 shadow-lg transform hover:scale-105 transition-transform">
            <!-- BookOpen Icon (SVG) -->
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
        </div>
        <h1 class="text-4xl font-bold text-gray-800 mb-2">꿈꾸는 직업 이야기</h1>
        <p class="text-gray-600 flex items-center justify-center gap-1">
            <!-- Sparkles Icon (SVG) -->
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-500"><path d="m12 3-1.9 5.8-5.9 1.9 5.9 1.9L12 21l1.9-5.8 5.9-1.9-5.9-1.9L12 3z"/></svg>
            아이들의 미래를 여는 스토리북
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-500"><path d="m12 3-1.9 5.8-5.9 1.9 5.9 1.9L12 21l1.9-5.8 5.9-1.9-5.9-1.9L12 3z"/></svg>
        </p>
    </div>

    <!-- Form Container -->
    <div class="bg-white rounded-3xl shadow-2xl p-8">
        <!-- Tab Navigation -->
        <div class="flex gap-2 mb-6 bg-gray-100 p-1 rounded-xl">
            <a th:href="@{/login}" class="flex-1 text-center py-3 rounded-lg font-semibold transition-all text-gray-500 hover:text-gray-700">
                로그인
            </a>
            <a th:href="@{/register}" class="flex-1 py-3 rounded-lg font-semibold transition-all bg-white text-purple-600 shadow-md">
                회원가입
            </a>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl relative mb-4" role="alert">
            <span class="block sm:inline" th:text="${error}"></span>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/register}" method="post" class="space-y-4" th:object="${userRegisterRequestDto}">
            <div>
                <label for="parentName" class="block text-sm font-medium text-gray-700 mb-2">보호자 이름</label>
                <input type="text" id="parentName" name="parentName" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none transition-colors" placeholder="홍길동" required />
            </div>
            <div>
                <label for="childName" class="block text-sm font-medium text-gray-700 mb-2">자녀 이름</label>
                <input type="text" id="childName" name="childName" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none transition-colors" placeholder="아이 이름을 입력해주세요" required />
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">이메일</label>
                <input type="email" id="email" name="email" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none transition-colors" placeholder="example@email.com" required />
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">비밀번호</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none transition-colors" placeholder="••••••••" required />
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-4 rounded-xl font-semibold text-lg shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition-all">
                회원가입
            </button>
        </form>

        <!-- Social Login Section -->
        <div class="mt-6">
            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-white text-gray-500">또는</span>
                </div>
            </div>
            <div class="mt-6 grid grid-cols-2 gap-3">
                <a href="/oauth2/authorization/kakao" class="flex items-center justify-center gap-2 px-4 py-3 border-2 border-gray-200 rounded-xl hover:border-gray-300 hover:bg-gray-50 transition-colors">
                    <div class="w-5 h-5 bg-yellow-400 rounded-full"></div>
                    <span class="font-medium text-gray-700">카카오</span>
                </a>
                <a href="/oauth2/authorization/naver" class="flex items-center justify-center gap-2 px-4 py-3 border-2 border-gray-200 rounded-xl hover:border-gray-300 hover:bg-gray-50 transition-colors">
                    <div class="w-5 h-5 bg-green-500 rounded-full"></div>
                    <span class="font-medium text-gray-700">네이버</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-6 text-sm text-gray-600">
        <p>© 2025 꿈꾸는 직업 이야기. All rights reserved.</p>
    </div>
</div>

</body>
</html>

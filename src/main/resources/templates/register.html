<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 키즈토리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse {
            50% { opacity: .5; }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen overflow-x-hidden text-gray-700 selection:bg-purple-200 selection:text-purple-900">

<!-- Background decorative elements (from main.html) -->
<div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute top-0 -left-4 w-96 h-96 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob"></div>
    <div class="absolute top-0 -right-4 w-96 h-96 bg-yellow-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob" style="animation-delay: 2s;"></div>
    <div class="absolute -bottom-32 left-20 w-96 h-96 bg-pink-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob" style="animation-delay: 4s;"></div>
</div>

<main class="flex-1 flex items-center justify-center px-4 pb-12 relative z-10 min-h-screen">
    <div class="max-w-md w-full">
        <!-- Header Section (similar to main.html) -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-3xl shadow-lg mb-6 animate-float text-purple-500 rotate-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
            </div>
            <h1 class="text-5xl font-title text-white mb-4 drop-shadow-md tracking-wide">키즈토리</h1>
            <p class="text-xl text-white/90 font-medium max-w-2xl mx-auto leading-relaxed">
                아이들의 상상력이 자라나는 곳
            </p>
        </div>

        <!-- Form Container (cloud-card style) -->
        <div class="cloud-card p-8 sm:p-10 rounded-[2.5rem]">
            <!-- Tab Navigation -->
            <div class="flex gap-2 mb-6 bg-gray-100 p-1 rounded-xl">
                <a th:href="@{/login}" class="flex-1 py-3 rounded-lg font-semibold transition-all text-gray-500 hover:text-gray-700 text-center">
                    로그인
                </a>
                <a th:href="@{/register}" class="flex-1 py-3 rounded-lg font-semibold transition-all bg-white text-purple-600 shadow-md text-center">
                    회원가입
                </a>
            </div>

            <!-- Error Message -->
            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl relative mb-4" role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
            </div>

            <!-- Registration Form -->
            <form th:action="@{/register}" method="post" class="space-y-4" th:object="${userRegisterRequestDto}">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">이메일</label>
                    <input type="email" id="email" name="email" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none transition-colors" placeholder="example@email.com" required />
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">비밀번호</label>
                    <input type="password" id="password" name="password" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none transition-colors" placeholder="••••••••" required />
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-4 rounded-xl font-semibold text-lg shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition-all">
                    회원가입
                </button>
            </form>
        </div>
    </div>
</main>

<footer class="text-center pb-6 pt-2 relative z-10">
    <p class="text-white/80 text-sm font-medium">© 2025 키즈토리. All rights reserved.</p>
</footer>

</body>
</html>

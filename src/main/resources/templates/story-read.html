<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스토리 읽기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 모바일 가로모드 강제 설정 -->
    <style>
        /* 모바일에서 가로모드 유도 */
        @media screen and (max-width: 768px) and (orientation: portrait) {
            body::before {
                content: "📱 더 나은 경험을 위해 가로모드로 회전해주세요";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.9);
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
                font-size: 18px;
                text-align: center;
                padding: 20px;
            }
            
            body > *:not(::before) {
                display: none;
            }
        }
        
        /* 모바일 가로모드에서는 동화책 레이아웃 사용 */
        @media screen and (max-width: 768px) and (orientation: landscape) {
            body {
                height: 100vh;
                overflow: hidden;
                padding: 0 !important;
            }
            
            .mobile-container {
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            
            .mobile-header {
                flex-shrink: 0;
                padding: 8px 16px;
            }
            
            .mobile-content {
                flex: 1;
                min-height: 0;
                overflow: hidden;
            }
            
            .mobile-landscape {
                display: flex !important;
                flex-direction: row !important;
                height: 100%;
            }
            
            .mobile-landscape .mobile-image {
                width: 50% !important;
                padding: 8px !important;
            }
            
            .mobile-landscape .mobile-text {
                width: 50% !important;
                padding: 8px !important;
                overflow-y: auto;
                max-height: 100%;
            }
            
            .mobile-landscape .mobile-image img {
                max-height: 100% !important;
                height: 100% !important;
                object-fit: cover;
            }
            
            /* 모바일 가로모드에서 폰트 크기 조정 */
            .mobile-text h1 {
                font-size: 1rem !important;
                margin-bottom: 4px !important;
            }
            
            .mobile-text p {
                font-size: 0.85rem !important;
                line-height: 1.3 !important;
            }
            
            .mobile-text .bg-purple-50 {
                padding: 12px !important;
                margin-bottom: 8px !important;
            }
            
            .mobile-text button, .mobile-text a {
                padding: 8px 12px !important;
                font-size: 0.8rem !important;
                margin-bottom: 4px !important;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-100 via-pink-50 to-blue-100 p-4">

<!-- 모바일 전용 컨테이너 -->
<div class="mobile-container">
    <!-- 제목 -->
    <div class="text-center mb-6 mobile-header">
        <h1 class="text-4xl font-black text-gray-800 mb-2" th:text="${page.themeName}">테마 이름</h1>
        <p class="text-gray-600">스토리를 읽고 계시네요!</p>
    </div>

    <!-- 동화책 스타일 레이아웃 -->
    <div class="max-w-7xl mx-auto mobile-content">
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden h-full">
            <div class="flex flex-col lg:flex-row mobile-landscape h-full">
            
            <!-- 왼쪽: 이미지 영역 (동화책 절반) -->
            <div class="lg:w-1/2 mobile-image bg-gradient-to-br from-purple-50 to-pink-50 flex items-center justify-center p-4 md:p-8">
                <div th:if="${page.imageUrl != null}" class="w-full h-full flex items-center justify-center">
                    <img th:src="${page.imageUrl}" alt="스토리 이미지" 
                         class="w-full h-full object-cover rounded-2xl shadow-lg min-h-60 md:min-h-80 lg:max-h-full"
                         style="max-height: 400px;">
                </div>
                <div th:unless="${page.imageUrl != null}" class="w-full h-60 md:h-96 bg-gradient-to-br from-purple-200 to-pink-200 rounded-2xl flex items-center justify-center">
                    <p class="text-purple-600 text-base md:text-lg font-semibold">이미지 없음</p>
                </div>
            </div>
            
            <!-- 오른쪽: 텍스트 영역 (동화책 절반) -->
            <div class="lg:w-1/2 mobile-text p-4 md:p-8 flex flex-col justify-between">
                
                <!-- 나레이션 -->
                <div class="flex-1 flex flex-col justify-center">
                    <div class="bg-purple-50 rounded-2xl p-6 mb-6">
                        <p class="text-gray-800 text-lg leading-relaxed whitespace-pre-line" th:text="${page.narration}">나레이션이 여기에 표시됩니다.</p>
                    </div>

                    <!-- 스토리 제목 -->
                    <div th:if="${page.storyTitle != null}" class="bg-white border border-purple-200 rounded-2xl p-4 mb-6">
                        <p class="text-sm uppercase text-purple-500 font-semibold">이야기 제목</p>
                        <p class="text-xl font-bold text-gray-800" th:text="${page.storyTitle}">우리의 멋진 이야기</p>
                    </div>
                    
                    <!-- 페이지 표시 -->
                    <div class="bg-blue-50 border border-blue-200 rounded-2xl p-3 mb-4 text-center">
                        <p class="text-blue-600 font-semibold" th:text="'페이지 ' + ${page.step}">페이지 1</p>
                    </div>
                </div>

                <!-- 네비게이션 영역 -->
                <div class="mt-auto">
                    <div class="flex gap-2">
                        <!-- 이전 페이지 -->
                        <a th:if="${page.step > 1}" 
                           th:href="@{'/story/read/{storyId}/page/{step}'(storyId=${page.storyId}, step=${page.step - 1})}"
                           class="flex-1 text-center px-4 py-3 bg-gray-500 text-white font-semibold rounded-xl hover:bg-gray-600 transition-all duration-300">
                            ← 이전
                        </a>
                        <div th:unless="${page.step > 1}" class="flex-1"></div>
                        
                        <!-- 서재로 돌아가기 -->
                        <a href="/bookshelf"
                           class="flex-1 text-center px-4 py-3 bg-purple-600 text-white font-semibold rounded-xl hover:bg-purple-700 transition-all duration-300">
                            📚 서재
                        </a>
                        
                        <!-- 다음 페이지 -->
                        <a th:if="${hasNext}" 
                           th:href="@{'/story/read/{storyId}/page/{step}'(storyId=${page.storyId}, step=${page.step + 1})}"
                           class="flex-1 text-center px-4 py-3 bg-blue-500 text-white font-semibold rounded-xl hover:bg-blue-600 transition-all duration-300">
                            다음 →
                        </a>
                        <div th:unless="${hasNext}" class="flex-1"></div>
                    </div>
                </div>
                
            </div> <!-- 오른쪽 텍스트 영역 끝 -->
        </div> <!-- flex 컨테이너 끝 -->
    </div> <!-- 메인 카드 끝 -->
</div> <!-- mobile-content 끝 -->

    <!-- 하단 네비게이션 -->
    <div class="text-center mt-6">
        <a href="/bookshelf" class="text-sm text-gray-600 hover:text-gray-800">서재로 돌아가기</a>
    </div>
</div> <!-- mobile-container 끝 -->

</body>
</html>

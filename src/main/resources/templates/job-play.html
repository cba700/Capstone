<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>직업 체험하기</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-100 via-green-50 to-yellow-100 flex items-center justify-center p-4">

<div class="w-full max-w-2xl">
    <div class="text-center mb-6">
        <h1 class="text-4xl font-black text-gray-800 mb-2" th:text="${page.story.selectedJob.name} + ' 체험' ">직업 체험</h1>
        <p class="text-gray-600">미션을 해결하고 최고의 전문가가 되어보세요!</p>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-8">
        <div class="bg-gray-50 rounded-2xl p-6 mb-6">
            <p class="text-gray-800 text-lg leading-relaxed whitespace-pre-line" th:text="${page.narration}">미션 내용이 여기에 표시됩니다.</p>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
            <div th:each="choice : ${page.choices}">
                <form th:action="@{/story/{storyId}/job/choice(storyId=${page.storyId})}" method="post">
                    <input type="hidden" name="choiceId" th:value="${choice.choiceId}"/>
                    <button type="submit" class="w-full h-full text-left p-4 bg-white border-2 border-gray-200 rounded-2xl hover:border-blue-500 hover:bg-blue-50 transition-all">
                        <p class.font-semibold text-gray-800" th:text="${choice.text}">선택지 텍스트</p>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꿈꾸는 직업 이야기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Pen+Script&family=Poor+Story&display=swap" rel="stylesheet">
    <style>
        /* 기본 폰트 설정 */
        body {
            font-family: 'Poor Story', cursive; /* 본문은 가독성 좋으면서 동화책 느낌 */
        }
        h1, h2, h3, .font-title {
            font-family: 'Jua', sans-serif; /* 제목은 굵고 귀여운 주아체 */
        }

        /* 배경 애니메이션 (기존 유지하되 부드럽게) */
        .gradient-bg {
            background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%); /* 더 파스텔톤으로 변경 */
            background: linear-gradient(135deg, #8EC5FC 0%, #E0C3FC 50%, #fbc2eb 100%);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 둥실둥실 떠다니는 효과 */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }

        /* 배경 블롭 애니메이션 */
        @keyframes blob {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        .animate-blob { animation: blob 10s infinite; }

        /* 카드 스타일: 구름처럼 하얗고 뽀송하게 */
        .cloud-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); /* 젤리 같은 탄성 */
        }

        .cloud-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 40px rgba(158, 158, 255, 0.2);
            border-color: #fff;
        }

        /* 사이드 메뉴 */
        #sideMenu {
            background: rgba(255, 255, 255, 0.95);
            border-top-right-radius: 2rem;
            border-bottom-right-radius: 2rem;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen overflow-x-hidden text-gray-700 selection:bg-purple-200 selection:text-purple-900">

<div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute top-0 -left-4 w-96 h-96 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob"></div>
    <div class="absolute top-0 -right-4 w-96 h-96 bg-yellow-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob" style="animation-delay: 2s;"></div>
    <div class="absolute -bottom-32 left-20 w-96 h-96 bg-pink-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob" style="animation-delay: 4s;"></div>
</div>

<div id="menuOverlay" class="fixed inset-0 bg-black/10 pointer-events-none transition-all duration-300 z-40 backdrop-blur-sm opacity-0"></div>

<div id="sideMenu" class="fixed top-0 left-0 h-full w-80 shadow-xl z-50 -translate-x-full p-6 flex flex-col">
    <div class="flex items-center justify-between mb-8 mt-2">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-purple-100 text-purple-500 rounded-full flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </div>
            <span class="text-2xl font-title text-gray-800">메뉴</span>
        </div>
        <button onclick="closeMenu()" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>

    <nav class="flex-1 space-y-2">
        <a href="/dashboard" class="flex items-center gap-4 px-5 py-3.5 rounded-2xl hover:bg-gray-50 text-gray-600 font-title text-lg transition-transform hover:translate-x-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v9H3z"></path><path d="M14 3h7v5h-7z"></path><path d="M14 12h7v9h-7z"></path><path d="M3 16h7v5H3z"></path></svg>
            대시보드
        </a>
        <a href="/children" class="flex items-center gap-4 px-5 py-3.5 rounded-2xl hover:bg-gray-50 text-gray-600 font-title text-lg transition-transform hover:translate-x-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            아이 관리
        </a>
    </nav>

    <div class="border-t border-gray-100 pt-4 mt-4">
        <form action="/logout" method="post" id="logoutForm">
            <button type="submit" class="w-full flex items-center gap-4 px-5 py-3.5 rounded-2xl text-gray-500 hover:text-red-500 hover:bg-red-50 font-title text-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                로그아웃
            </button>
        </form>
    </div>
</div>

<div class="min-h-screen flex flex-col relative z-10">
    <header class="p-4 sm:p-8">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <button onclick="openMenu()" class="group p-3 bg-white/80 backdrop-blur-md rounded-2xl shadow-sm hover:shadow-md transition-all">
                <svg class="text-gray-600 group-hover:text-purple-500 transition-colors" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <div class="flex items-center gap-3 sm:gap-6">
                <div class="hidden sm:flex gap-3">
                    <button onclick="window.location.href='/children'" class="px-5 py-2.5 bg-white/80 backdrop-blur-md rounded-full shadow-sm hover:bg-white text-gray-600 hover:text-purple-600 font-title text-lg transition-all">
                        아이 관리
                    </button>
                    <button onclick="window.location.href='/bookshelf'" class="px-5 py-2.5 bg-white/80 backdrop-blur-md rounded-full shadow-sm hover:bg-white text-gray-600 hover:text-purple-600 font-title text-lg transition-all">
                        스토리 서재
                    </button>
                </div>

                <div class="flex items-center gap-3 pl-2 sm:pl-4 sm:border-l border-white/30">
                    <div class="hidden sm:block text-right">
                        <p class="font-title text-white text-lg leading-none mb-1 shadow-sm">반가워요!</p>
                        <p class="text-white/90 text-sm font-medium">오늘도 즐거운 여행 떠나요</p>
                    </div>
                    <div class="w-12 h-12 bg-white/90 rounded-full flex items-center justify-center shadow-lg ring-4 ring-white/30 cursor-pointer hover:scale-105 transition-transform">
                        <span class="font-title text-purple-500 text-xl pt-1">아</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 pb-12">
        <div class="max-w-6xl w-full">

            <div class="text-center mb-14 mt-4">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-3xl shadow-lg mb-6 animate-float text-yellow-400 rotate-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                </div>

                <h1 class="text-5xl sm:text-6xl font-title text-white mb-4 drop-shadow-md tracking-wide">
                    어떤 꿈을 꾸고 있나요?
                </h1>
                <p class="text-xl sm:text-2xl text-white/90 font-medium max-w-2xl mx-auto leading-relaxed">
                    오늘은 아이와 함께 세상에서 가장 특별한<br/>
                    직업 여행을 떠나보세요
                </p>
            </div>

            <div class="grid md:grid-cols-2 gap-6 sm:gap-10 px-2 sm:px-10">

                <div th:if="${selectedChild != null}" class="h-full">
                    <a th:href="@{/story/new(childId=${selectedChild.id})}" class="cloud-card block p-8 sm:p-10 rounded-[2.5rem] h-full group relative overflow-hidden text-left">
                        <div class="absolute -right-10 -top-10 w-40 h-40 bg-blue-100 rounded-full mix-blend-multiply opacity-50 group-hover:scale-150 transition-transform duration-700"></div>

                        <div class="relative z-10">
                            <div class="flex justify-between items-start mb-8">
                                <div class="w-16 h-16 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center shadow-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
                                </div>
                                <span class="px-4 py-1.5 bg-blue-100 text-blue-600 rounded-full text-sm font-title font-bold">START</span>
                            </div>

                            <h2 class="text-3xl font-title text-gray-800 mb-3" th:text="|${selectedChild.name}의 이야기 만들기|">
                                이야기 만들기
                            </h2>
                            <p class="text-gray-500 text-lg leading-relaxed">
                                새로운 모험을 시작할 준비가 되었나요?<br/>
                                상상 속 직업 이야기를 만들어봐요.
                            </p>
                        </div>
                    </a>
                </div>

                <div th:if="${selectedChild == null}" class="h-full">
                    <a href="/children" class="cloud-card block p-8 sm:p-10 rounded-[2.5rem] h-full group relative overflow-hidden text-left">
                        <div class="absolute -right-10 -top-10 w-40 h-40 bg-gray-100 rounded-full mix-blend-multiply opacity-50 group-hover:scale-150 transition-transform duration-700"></div>

                        <div class="relative z-10">
                            <div class="flex justify-between items-start mb-8">
                                <div class="w-16 h-16 bg-gray-50 text-gray-400 rounded-2xl flex items-center justify-center shadow-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                </div>
                            </div>

                            <h2 class="text-3xl font-title text-gray-800 mb-3">누구의 이야기인가요?</h2>
                            <p class="text-gray-500 text-lg leading-relaxed">
                                먼저 아이를 선택해주세요.<br/>
                                주인공을 정해야 이야기가 시작됩니다.
                            </p>
                        </div>
                    </a>
                </div>

                <a href="/children" class="cloud-card block p-8 sm:p-10 rounded-[2.5rem] h-full group relative overflow-hidden text-left">
                    <div class="absolute -right-10 -top-10 w-40 h-40 bg-pink-100 rounded-full mix-blend-multiply opacity-50 group-hover:scale-150 transition-transform duration-700"></div>

                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-8">
                            <div class="w-16 h-16 bg-pink-50 text-pink-500 rounded-2xl flex items-center justify-center shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                            </div>
                            <span class="px-4 py-1.5 bg-pink-100 text-pink-500 rounded-full text-sm font-title font-bold">KIDS</span>
                        </div>

                        <h2 class="text-3xl font-title text-gray-800 mb-3">우리 아이 관리</h2>
                        <p class="text-gray-500 text-lg leading-relaxed mb-6">
                            등록된 아이들을 확인하고<br/>
                            새로운 주인공을 등록할 수 있어요.
                        </p>

                        <div class="inline-flex items-center gap-2 bg-gradient-to-r from-pink-50 to-orange-50 px-5 py-3 rounded-2xl border border-pink-100">
                            <span class="text-3xl font-title text-pink-500" th:text="${#lists.size(children)}">0</span>
                            <span class="text-lg text-gray-600 font-medium">명의 아이들이 있어요</span>
                        </div>
                    </div>
                </a>

            </div>
        </div>
    </main>

    <footer class="text-center pb-6 pt-2">
        <p class="text-white/80 text-sm font-medium">© 2025 꿈꾸는 직업 이야기</p>
    </footer>
</div>

<script>
    function openMenu() {
        const menu = document.getElementById('sideMenu');
        const overlay = document.getElementById('menuOverlay');
        menu.style.transform = 'translateX(0)';
        overlay.classList.remove('opacity-0', 'pointer-events-none');
        overlay.classList.add('opacity-100', 'pointer-events-auto');
    }

    function closeMenu() {
        const menu = document.getElementById('sideMenu');
        const overlay = document.getElementById('menuOverlay');
        menu.style.transform = 'translateX(-100%)';
        overlay.classList.remove('opacity-100', 'pointer-events-auto');
        overlay.classList.add('opacity-0', 'pointer-events-none');
    }

    document.getElementById('menuOverlay').addEventListener('click', closeMenu);
</script>

</body>
</html>

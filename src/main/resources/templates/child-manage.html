<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이 선택 - 꿈꾸는 직업 이야기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

        * {
            font-family: 'Noto Sans KR', sans-serif;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-15px) rotate(2deg); }
            66% { transform: translateY(-8px) rotate(-2deg); }
        }

        @keyframes float-slow {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(20px, -20px) rotate(5deg); }
        }

        @keyframes blob {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-float-slow {
            animation: float-slow 8s ease-in-out infinite;
        }

        .animate-blob {
            animation: blob 7s ease-in-out infinite;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .card-hover {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card-hover:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px -12px rgba(50, 50, 93, 0.25), 0 12px 24px -12px rgba(0, 0, 0, 0.3);
        }

        .modal {
            transition: all 0.3s ease;
        }

        .modal.show {
            display: flex !important;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen overflow-x-hidden">

<!-- Floating Background Shapes -->
<div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute top-20 -left-20 w-72 h-72 bg-purple-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
    <div class="absolute top-40 -right-20 w-72 h-72 bg-yellow-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob" style="animation-delay: 2s;"></div>
    <div class="absolute -bottom-20 left-1/3 w-72 h-72 bg-pink-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob" style="animation-delay: 4s;"></div>
    <div class="absolute top-1/2 right-1/4 w-96 h-96 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob" style="animation-delay: 6s;"></div>
</div>

<!-- Add Child Modal -->
<div id="addModal" class="modal fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="glass rounded-[3rem] shadow-2xl p-8 max-w-md w-full transform scale-95 transition-transform">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-3xl font-black text-gray-800">새 아이 추가 ✨</h2>
            <button onclick="closeAddModal()" class="p-2 hover:bg-gray-100 rounded-xl transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <form onsubmit="addChild(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">이름</label>
                <input type="text" id="childName" required class="w-full px-5 py-3 rounded-2xl border-2 border-gray-200 focus:border-purple-500 focus:outline-none font-medium transition-all" placeholder="아이의 이름을 입력하세요">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">나이</label>
                <input type="number" id="childAge" required min="1" max="18" class="w-full px-5 py-3 rounded-2xl border-2 border-gray-200 focus:border-purple-500 focus:outline-none font-medium transition-all" placeholder="나이를 입력하세요">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-3">성별</label>
                <div class="flex gap-3">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="gender" value="남" required class="hidden peer">
                        <div class="px-6 py-4 rounded-2xl border-2 border-gray-200 peer-checked:border-blue-500 peer-checked:bg-blue-50 text-center font-bold text-gray-600 peer-checked:text-blue-600 transition-all hover:border-blue-300">
                            👦 남자
                        </div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="gender" value="여" required class="hidden peer">
                        <div class="px-6 py-4 rounded-2xl border-2 border-gray-200 peer-checked:border-pink-500 peer-checked:bg-pink-50 text-center font-bold text-gray-600 peer-checked:text-pink-600 transition-all hover:border-pink-300">
                            👧 여자
                        </div>
                    </label>
                </div>
            </div>

            <button type="submit" class="w-full py-4 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-black text-lg rounded-2xl shadow-lg hover:shadow-xl transform hover:scale-105 transition-all">
                추가하기
            </button>
        </form>
    </div>
</div>

<!-- Main Content -->
<div class="min-h-screen flex flex-col relative z-10">
    <!-- Header -->
    <header class="p-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <button onclick="window.history.back()" class="p-4 glass rounded-3xl shadow-xl hover:shadow-2xl transform hover:scale-110 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#gradient1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>

            <div class="flex items-center gap-4">
                <div class="hidden sm:block text-right">
                    <p class="font-black text-white text-lg">아이 관리</p>
                    <p class="text-white text-sm opacity-90">누구의 이야기를 만들까요? 👨‍👩‍👧‍👦</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Section -->
    <main class="flex-1 flex items-center justify-center px-4 sm:px-6 pb-12">
        <div class="max-w-6xl w-full">
            <!-- Title Section -->
            <div class="text-center mb-12">
                <div class="inline-block mb-6 animate-float">
                    <div class="w-32 h-32 bg-gradient-to-br from-green-400 via-blue-500 to-purple-600 rounded-full flex items-center justify-center shadow-2xl relative">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                </div>
                <h1 class="text-5xl sm:text-7xl font-black text-white mb-4 drop-shadow-lg">
                    우리 아이들 👨‍👩‍👧‍👦
                </h1>
                <p class="text-xl sm:text-2xl text-white font-bold opacity-95">
                    아이를 선택하거나 새로운 아이를 추가해보세요
                </p>
            </div>

            <!-- Add New Child Card -->
            <div class="mb-8">
                <div onclick="openAddModal()" class="glass rounded-[3rem] shadow-2xl p-8 card-hover cursor-pointer overflow-hidden relative group">
                    <div class="absolute inset-0 bg-gradient-to-br from-green-500 to-blue-600 opacity-0 group-hover:opacity-10 transition-opacity"></div>
                    <div class="relative z-10 flex items-center gap-6">
                        <div class="w-20 h-20 bg-gradient-to-br from-green-500 to-blue-600 rounded-3xl flex items-center justify-center shadow-xl flex-shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h2 class="text-3xl font-black text-gray-800 mb-2">새 아이 추가하기</h2>
                            <p class="text-gray-600 text-lg font-medium">
                                새로운 아이의 정보를 등록해보세요 ✨
                            </p>
                        </div>
                        <div class="px-5 py-3 bg-green-100 text-green-600 rounded-full text-sm font-black">NEW</div>
                    </div>
                </div>
            </div>

            <!-- Children List -->
            <div id="childrenList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Children cards will be dynamically added here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="text-center py-12 hidden">
                <div class="glass rounded-[3rem] shadow-xl p-12">
                    <div class="text-6xl mb-6">👶</div>
                    <h3 class="text-2xl font-black text-gray-800 mb-3">아직 등록된 아이가 없어요</h3>
                    <p class="text-gray-600 font-medium">위의 '새 아이 추가하기' 버튼을 눌러<br/>첫 번째 아이를 등록해보세요!</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center pb-8 text-white font-bold opacity-90">
        <p>© 2025 꿈꾸는 직업 이야기. All rights reserved.</p>
    </footer>
</div>

<script>
    let children = [];

    // Fetch children from the server
    async function loadChildren() {
        try {
            const response = await fetch('/api/children');
            if (!response.ok) {
                throw new Error('Failed to load children. Status: ' + response.status);
            }
            children = await response.json();
            renderChildren();
        } catch (error) {
            console.error('Error loading children:', error);
            alert('아이 목록을 불러오는 데 실패했습니다.');
        }
    }

    // Render children list
    function renderChildren() {
        const list = document.getElementById('childrenList');
        const emptyState = document.getElementById('emptyState');

        if (children.length === 0) {
            list.innerHTML = '';
            emptyState.classList.remove('hidden');
            return;
        }

        emptyState.classList.add('hidden');

        const genderColors = {
            '남': { bg: 'from-blue-500 to-cyan-500', badge: 'bg-blue-100 text-blue-600', emoji: '👦' },
            '여': { bg: 'from-pink-500 to-rose-500', badge: 'bg-pink-100 text-pink-600', emoji: '👧' }
        };

        list.innerHTML = children.map(child => {
            const colors = genderColors[child.gender];
            return `
                <div class="glass rounded-[2.5rem] shadow-xl p-8 card-hover overflow-hidden relative group">
                     <div class="absolute inset-0 bg-gradient-to-br ${colors.bg} opacity-0 group-hover:opacity-10 transition-opacity"></div>
                     <div class="relative z-10">
                         <div class="flex justify-between items-start mb-6">
                             <div class="w-16 h-16 bg-gradient-to-br ${colors.bg} rounded-3xl flex items-center justify-center shadow-lg text-3xl">
                                 ${colors.emoji}
                             </div>
                             <button onclick="deleteChild(${child.id}); event.stopPropagation();" class="p-2 hover:bg-red-100 rounded-xl transition-all group/btn">
                                 <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400 group-hover/btn:text-red-500">
                                     <polyline points="3 6 5 6 21 6"></polyline>
                                     <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                 </svg>
                             </button>
                         </div>

                         <h3 class="text-3xl font-black text-gray-800 mb-3">${child.name}</h3>

                         <div class="flex gap-2 mb-4">
                             <span class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full text-sm font-bold">
                                 🎂 ${child.age}살
                             </span>
                             <span class="px-4 py-2 ${colors.badge} rounded-full text-sm font-bold">
                                 ${child.gender === '남' ? '👦 남자' : '👧 여자'}
                             </span>
                         </div>

                         <div class="pt-4 border-t border-gray-200">
                             <button onclick="selectChild(${child.id})" class="w-full py-3 bg-gradient-to-r ${colors.bg} text-white font-bold rounded-xl shadow-md hover:shadow-lg transform hover:scale-105 transition-all">
                                 이야기 만들기
                             </button>
                         </div>
                     </div>
                 </div>
            `;
        }).join('');
    }

    // Open add modal
    function openAddModal() {
        document.getElementById('addModal').classList.add('show');
        document.getElementById('childName').value = '';
        document.getElementById('childAge').value = '';
        document.querySelectorAll('input[name="gender"]').forEach(r => r.checked = false);
    }

    // Close add modal
    function closeAddModal() {
        document.getElementById('addModal').classList.remove('show');
    }

    // Add new child via API
    async function addChild(event) {
        event.preventDefault();

        const name = document.getElementById('childName').value;
        const age = parseInt(document.getElementById('childAge').value);
        const gender = document.querySelector('input[name="gender"]:checked').value;

        const newChild = { name, age, gender };

        try {
            const response = await fetch('/api/children', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(newChild)
            });

            if (!response.ok) {
                throw new Error('Failed to add child. Status: ' + response.status);
            }

            await loadChildren(); // Reload the list from DB
            closeAddModal();
        } catch (error) {
            console.error('Error adding child:', error);
            alert('아이 추가에 실패했습니다.');
        }
    }

    // Delete child via API
    async function deleteChild(id) {
        if (confirm('정말로 삭제하시겠습니까?')) {
            try {
                const response = await fetch(`/api/children/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete child. Status: ' + response.status);
                }

                await loadChildren(); // Reload the list from DB
            } catch (error) {
                console.error('Error deleting child:', error);
                alert('아이 삭제에 실패했습니다.');
            }
        }
    }

    // Select child and move to story creation
    function selectChild(id) {
        // Redirect to the theme selection page with the child's ID
        window.location.href = `/story/new?childId=${id}`;
    }

    // Close modal on overlay click
    document.getElementById('addModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeAddModal();
        }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', loadChildren);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Poor+Story&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poor Story', cursive; }
        h1, h2, h3, button, .font-title { font-family: 'Jua', sans-serif; }

        .gradient-bg {
            background: linear-gradient(135deg, #8EC5FC 0%, #E0C3FC 100%);
            background-attachment: fixed;
        }

        .cloud-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 2rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .cloud-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.95);
            border-color: #fff;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen overflow-x-hidden text-gray-700">

<div class="min-h-screen flex flex-col">
    <header class="p-6">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <a href="/main" class="group flex items-center gap-2 px-4 py-2 bg-white/60 rounded-full hover:bg-white transition-all">
                <svg class="text-gray-500 group-hover:text-purple-500" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <span class="font-title text-gray-600 group-hover:text-purple-500">돌아가기</span>
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 pb-12">
        <div class="max-w-6xl w-full">
            <div class="text-center mb-10">
                <h1 class="text-5xl text-white mb-2 drop-shadow-sm">우리 아이들</h1>
                <p class="text-white/90 text-lg">등록된 친구들을 관리해요</p>
            </div>

            <div class="mb-8">
                <a href="/children/new" class="cloud-card block p-6 group border-dashed !border-purple-200 hover:!border-purple-400 cursor-pointer">
                    <div class="flex items-center justify-center gap-3 py-2">
                        <div class="w-10 h-10 bg-purple-100 text-purple-500 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </div>
                        <span class="text-xl font-title text-gray-600 group-hover:text-purple-600">새 친구 추가하기</span>
                    </div>
                </a>
            </div>

            <div th:if="${!children.isEmpty()}" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div th:each="child : ${children}" class="cloud-card p-6 flex flex-col h-full relative">

                    <div class="flex justify-between items-start mb-4">
                        <div class="w-16 h-16 rounded-2xl flex items-center justify-center border-2 border-white shadow-sm"
                             th:classappend="${child.gender.name() == 'BOY'} ? 'bg-blue-50 text-blue-400' : 'bg-pink-50 text-pink-400'">

                            <svg th:if="${child.gender.name() == 'BOY'}" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>

                            <svg th:if="${child.gender.name() == 'GIRL'}" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a7 7 0 0 1 7 7c0 2.5-2 4-3.5 5"/><path d="M8.5 14C7 13 5 11.5 5 9a7 7 0 0 1 7-7"/><path d="M9 9h.01"/><path d="M15 9h.01"/><path d="M8 15a4 4 0 0 0 8 0"/></svg>
                        </div>

                        <form th:action="@{/children/delete/{id}(id=${child.id})}" method="post" onsubmit="return confirm('정말로 삭제할까요?');">
                            <button type="submit" class="p-2 text-gray-300 hover:text-red-400 hover:bg-red-50 rounded-full transition-all">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                            </button>
                        </form>
                    </div>

                    <div class="flex-1">
                        <h3 class="text-2xl font-title text-gray-800 mb-2" th:text="${child.name}">이름</h3>
                        <div class="flex gap-2 mb-6">
                            <div class="px-3 py-1 bg-gray-100 text-gray-600 rounded-lg text-sm font-bold flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                <span th:text="${child.age} + '살'"></span>
                            </div>
                            <div class="px-3 py-1 rounded-lg text-sm font-bold flex items-center gap-1 border"
                                 th:classappend="${child.gender.name() == 'BOY'} ? 'bg-blue-50 text-blue-500 border-blue-100' : 'bg-pink-50 text-pink-500 border-pink-100'">
                                <svg th:if="${child.gender.name() == 'BOY'}" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                                <svg th:if="${child.gender.name() == 'GIRL'}" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                                <span th:text="${child.gender.name() == 'BOY'} ? '남자' : '여자'"></span>
                            </div>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-gray-100">
                        <form th:action="@{/children/select/{id}(id=${child.id})}" method="post">
                            <button type="submit" class="w-full py-3 rounded-xl font-title text-lg text-white transition-all shadow-sm hover:shadow-md active:scale-95 flex justify-center items-center gap-2"
                                    th:classappend="${child.gender.name() == 'BOY'} ? 'bg-blue-400 hover:bg-blue-500' : 'bg-pink-400 hover:bg-pink-500'">
                                <span>선택하기</span>
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div th:if="${children.isEmpty()}" class="text-center py-16">
                <div class="cloud-card inline-block p-10 max-w-sm mx-auto">
                    <div class="text-gray-300 mb-4 flex justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19c0-1.7-1.3-3-3-3h-11c-1.7 0-3 1.3-3 3s1.3 3 3 3h11c1.7 0 3-1.3 3-3z"></path><path d="M17.5 16c2.5 0 4.5-2 4.5-4.5s-2-4.5-4.5-4.5c-.4 0-.7 0-1 .1-.6-3.2-3.4-5.6-6.8-5.6-3.8 0-6.9 3.1-6.9 6.9 0 .4 0 .7.1 1C1.1 9.9 0 11.3 0 13c0 1.7 1.3 3 3 3h1.6"></path></svg>
                    </div>
                    <h3 class="text-2xl font-title text-gray-600 mb-2">아직 친구가 없네요</h3>
                    <p class="text-gray-400">위의 버튼을 눌러 추가해주세요.</p>
                </div>
            </div>

        </div>
    </main>
</div>
</body>
</html>

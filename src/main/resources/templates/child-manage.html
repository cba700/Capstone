<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이 관리 - 꿈꾸는 직업 이야기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        * { font-family: 'Noto Sans KR', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .card-hover { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card-hover:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 40px -12px rgba(50, 50, 93, 0.25), 0 12px 24px -12px rgba(0, 0, 0, 0.3); }
    </style>
</head>
<body class="gradient-bg min-h-screen overflow-x-hidden">

<div class="min-h-screen flex flex-col relative z-10">
    <!-- Header -->
    <header class="p-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/main" class="p-4 glass rounded-3xl shadow-xl hover:shadow-2xl transform hover:scale-110 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <div class="text-right">
                <p class="font-black text-white text-lg">아이 관리</p>
                <p class="text-white text-sm opacity-90">아이를 추가, 삭제하고 관리해요 👨‍👩‍👧‍👦</p>
            </div>
        </div>
    </header>

    <!-- Main Section -->
    <main class="flex-1 flex items-center justify-center px-4 sm:px-6 pb-12">
        <div class="max-w-6xl w-full">
            <!-- Title Section -->
            <div class="text-center mb-12">
                <h1 class="text-5xl sm:text-7xl font-black text-white mb-4 drop-shadow-lg">우리 아이들</h1>
            </div>

            <!-- Add New Child Card -->
            <div class="mb-8">
                <a href="/children/new" class="block glass rounded-[3rem] shadow-2xl p-8 card-hover cursor-pointer overflow-hidden relative group">
                    <div class="relative z-10 flex items-center gap-6">
                        <div class="w-20 h-20 bg-gradient-to-br from-green-500 to-blue-600 rounded-3xl flex items-center justify-center shadow-xl flex-shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </div>
                        <div>
                            <h2 class="text-3xl font-black text-gray-800 mb-2">새 아이 추가하기</h2>
                            <p class="text-gray-600 text-lg font-medium">새로운 아이의 정보를 등록해보세요 ✨</p>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Children List -->
            <div th:if="${!children.isEmpty()}" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div th:each="child : ${children}" class="glass rounded-[2.5rem] shadow-xl p-8 card-hover overflow-hidden relative group">
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-6">
                            <div class="w-16 h-16 bg-gradient-to-br rounded-3xl flex items-center justify-center shadow-lg text-3xl"
                                 th:classappend="${child.gender.name() == 'BOY'} ? 'from-blue-500 to-cyan-500' : 'from-pink-500 to-rose-500'">
                                <span th:text="${child.gender.name() == 'BOY'} ? '👦' : '👧'"></span>
                            </div>
                            <form th:action="@{/children/delete/{id}(id=${child.id})}" method="post" onsubmit="return confirm('정말로 삭제하시겠습니까?');">
                                <button type="submit" class="p-2 hover:bg-red-100 rounded-xl transition-all group/btn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400 group-hover/btn:text-red-500"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </form>
                        </div>
                        <h3 class="text-3xl font-black text-gray-800 mb-3" th:text="${child.name}"></h3>
                        <div class="flex gap-2 mb-4">
                            <span class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full text-sm font-bold" th:text="'🎂 ' + ${child.age} + '살'"></span>
                            <span class="px-4 py-2 rounded-full text-sm font-bold"
                                  th:classappend="${child.gender.name() == 'BOY'} ? 'bg-blue-100 text-blue-600' : 'bg-pink-100 text-pink-600'"
                                  th:text="${child.gender.name() == 'BOY'} ? '👦 남자' : '👧 여자'"></span>
                        </div>
                         <div class="pt-4 border-t border-gray-200">
                            <form th:action="@{/children/select/{id}(id=${child.id})}" method="post">
                                 <button type="submit" class="block w-full text-center py-3 bg-gradient-to-r text-white font-bold rounded-xl shadow-md hover:shadow-lg transform hover:scale-105 transition-all"
                                    th:classappend="${child.gender.name() == 'BOY'} ? 'from-blue-500 to-cyan-500' : 'from-pink-500 to-rose-500'">
                                     아이 선택
                                 </button>
                             </form>
                         </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${children.isEmpty()}" class="text-center py-12">
                <div class="glass rounded-[3rem] shadow-xl p-12">
                    <div class="text-6xl mb-6">👶</div>
                    <h3 class="text-2xl font-black text-gray-800 mb-3">아직 등록된 아이가 없어요</h3>
                    <p class="text-gray-600 font-medium">위의 '새 아이 추가하기' 버튼을 눌러<br/>첫 번째 아이를 등록해보세요!</p>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>

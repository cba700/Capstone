
server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

    url: jdbc:mysql://localhost:3306/capstone?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: 1234


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always

  profiles:
    active: local

gemini:
  api-key: ${GEMINI_API_KEY}
  model-name: "gemini-2.5-flash"
  image-model-name: "gemini-2.5-flash-image"

story:
  image:
    save-path: "./story-images"
    base-url: "/story-images"
